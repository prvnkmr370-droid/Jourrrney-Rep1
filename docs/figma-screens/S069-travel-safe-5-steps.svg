<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="844" viewBox="0 0 390 844"><title>S069 travel-safe-5-steps</title><defs><clipPath id="__frame"><rect width="390" height="844"/></clipPath><clipPath id="c1"><rect x="0" y="0" width="390" height="844" /></clipPath><clipPath id="c2"><rect x="0" y="0" width="390" height="844" /></clipPath></defs><rect width="390" height="844" fill="#ffffff"/><g clip-path="url(#__frame)"><g clip-path="url(#c2)"><rect x="0" y="0" width="390" height="844" fill="#f2f2f2"/><rect x="0" y="0" width="390" height="844" fill="#15120e"/><rect x="0" y="0" width="390" height="844" fill="#15120e"/><g clip-path="url(#c1)"><path d="M38 12H38A18 18 0 0 1 56 30V30A18 18 0 0 1 38 48H38A18 18 0 0 1 20 30V30A18 18 0 0 1 38 12Z" fill="#211c16"/><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5F1EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="29" y="21"><path fill="none" stroke="#F5F1EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m12 19-7-7 7-7"/><path fill="none" stroke="#F5F1EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M19 12H5"/></svg><text x="68" y="37.5" font-family="Poppins, sans-serif" font-size="22" font-weight="700" fill="#f5f1ea" xml:space="preserve">Travel Safe</text><text x="20" y="70" font-family="Poppins, sans-serif" font-size="13" font-weight="400" fill="#b5afa6" xml:space="preserve">A few habits that go a long way — for anyone</text><text x="20" y="89" font-family="Poppins, sans-serif" font-size="13" font-weight="400" fill="#b5afa6" xml:space="preserve">travelling solo, especially women.</text><path d="M36 114H354A16 16 0 0 1 370 130V190A16 16 0 0 1 354 206H36A16 16 0 0 1 20 190V130A16 16 0 0 1 36 114Z" fill="#211c16"/><path d="M36 114.5H354A15.5 15.5 0 0 1 369.5 130V190A15.5 15.5 0 0 1 354 205.5H36A15.5 15.5 0 0 1 20.5 190V130A15.5 15.5 0 0 1 36 114.5Z" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/><path d="M53 131H53A16 16 0 0 1 69 147V147A16 16 0 0 1 53 163H53A16 16 0 0 1 37 147V147A16 16 0 0 1 53 131Z" fill="#4fc3cc" fill-opacity="0.15"/><text x="50.36" y="151.5" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#4fc3cc" xml:space="preserve">1</text><text x="83" y="146" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#f5f1ea" xml:space="preserve">Always share location</text><text x="83" y="168" font-family="Poppins, sans-serif" font-size="12" font-weight="400" fill="#b5afa6" xml:space="preserve">Use Google Maps live location with a trusted</text><text x="83" y="185" font-family="Poppins, sans-serif" font-size="12" font-weight="400" fill="#b5afa6" xml:space="preserve">contact before every new leg.</text><path d="M36 218H354A16 16 0 0 1 370 234V294A16 16 0 0 1 354 310H36A16 16 0 0 1 20 294V234A16 16 0 0 1 36 218Z" fill="#211c16"/><path d="M36 218.5H354A15.5 15.5 0 0 1 369.5 234V294A15.5 15.5 0 0 1 354 309.5H36A15.5 15.5 0 0 1 20.5 294V234A15.5 15.5 0 0 1 36 218.5Z" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/><path d="M53 235H53A16 16 0 0 1 69 251V251A16 16 0 0 1 53 267H53A16 16 0 0 1 37 251V251A16 16 0 0 1 53 235Z" fill="#4fc3cc" fill-opacity="0.15"/><text x="49" y="255.5" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#4fc3cc" xml:space="preserve">2</text><text x="83" y="250" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#f5f1ea" xml:space="preserve">Book trusted transport</text><text x="83" y="272" font-family="Poppins, sans-serif" font-size="12" font-weight="400" fill="#b5afa6" xml:space="preserve">Use Ola, Uber, or RedBus. Note the vehicle</text><text x="83" y="289" font-family="Poppins, sans-serif" font-size="12" font-weight="400" fill="#b5afa6" xml:space="preserve">number and driver ID before boarding.</text><path d="M36 322H354A16 16 0 0 1 370 338V398A16 16 0 0 1 354 414H36A16 16 0 0 1 20 398V338A16 16 0 0 1 36 322Z" fill="#211c16"/><path d="M36 322.5H354A15.5 15.5 0 0 1 369.5 338V398A15.5 15.5 0 0 1 354 413.5H36A15.5 15.5 0 0 1 20.5 398V338A15.5 15.5 0 0 1 36 322.5Z" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/><path d="M53 339H53A16 16 0 0 1 69 355V355A16 16 0 0 1 53 371H53A16 16 0 0 1 37 355V355A16 16 0 0 1 53 339Z" fill="#4fc3cc" fill-opacity="0.15"/><text x="48.75" y="359.5" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#4fc3cc" xml:space="preserve">3</text><text x="83" y="354" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#f5f1ea" xml:space="preserve">Choose central stays</text><text x="83" y="376" font-family="Poppins, sans-serif" font-size="12" font-weight="400" fill="#b5afa6" xml:space="preserve">Established hotels or hostels in busy tourist</text><text x="83" y="393" font-family="Poppins, sans-serif" font-size="12" font-weight="400" fill="#b5afa6" xml:space="preserve">areas, not isolated guesthouses.</text><path d="M36 426H354A16 16 0 0 1 370 442V502A16 16 0 0 1 354 518H36A16 16 0 0 1 20 502V442A16 16 0 0 1 36 426Z" fill="#211c16"/><path d="M36 426.5H354A15.5 15.5 0 0 1 369.5 442V502A15.5 15.5 0 0 1 354 517.5H36A15.5 15.5 0 0 1 20.5 502V442A15.5 15.5 0 0 1 36 426.5Z" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/><path d="M53 443H53A16 16 0 0 1 69 459V459A16 16 0 0 1 53 475H53A16 16 0 0 1 37 459V459A16 16 0 0 1 53 443Z" fill="#4fc3cc" fill-opacity="0.15"/><text x="48.25" y="463.5" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#4fc3cc" xml:space="preserve">4</text><text x="83" y="458" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#f5f1ea" xml:space="preserve">Night travel safety</text><text x="83" y="480" font-family="Poppins, sans-serif" font-size="12" font-weight="400" fill="#b5afa6" xml:space="preserve">Book overnight trains with AC coaches rather</text><text x="83" y="497" font-family="Poppins, sans-serif" font-size="12" font-weight="400" fill="#b5afa6" xml:space="preserve">than unreserved seating.</text><path d="M36 530H354A16 16 0 0 1 370 546V606A16 16 0 0 1 354 622H36A16 16 0 0 1 20 606V546A16 16 0 0 1 36 530Z" fill="#211c16"/><path d="M36 530.5H354A15.5 15.5 0 0 1 369.5 546V606A15.5 15.5 0 0 1 354 621.5H36A15.5 15.5 0 0 1 20.5 606V546A15.5 15.5 0 0 1 36 530.5Z" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/><path d="M53 547H53A16 16 0 0 1 69 563V563A16 16 0 0 1 53 579H53A16 16 0 0 1 37 563V563A16 16 0 0 1 53 547Z" fill="#4fc3cc" fill-opacity="0.15"/><text x="48.44" y="567.5" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#4fc3cc" xml:space="preserve">5</text><text x="83" y="562" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#f5f1ea" xml:space="preserve">Trust your gut</text><text x="83" y="584" font-family="Poppins, sans-serif" font-size="12" font-weight="400" fill="#b5afa6" xml:space="preserve">If a situation, person, or place feels off —</text><text x="83" y="601" font-family="Poppins, sans-serif" font-size="12" font-weight="400" fill="#b5afa6" xml:space="preserve">leave immediately.</text><path d="M36 642H354A16 16 0 0 1 370 658V718A16 16 0 0 1 354 734H36A16 16 0 0 1 20 718V658A16 16 0 0 1 36 642Z" fill="#2b241b"/><text x="36" y="674" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#4fc3cc" xml:space="preserve">You are not alone. 🌸</text><text x="36" y="697" font-family="Poppins, sans-serif" font-size="12" font-weight="400" fill="#b5afa6" xml:space="preserve">Millions of women travel solo across India every year,</text><text x="36" y="714" font-family="Poppins, sans-serif" font-size="12" font-weight="400" fill="#b5afa6" xml:space="preserve">safely.</text></g></g></g></svg>