<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="844" viewBox="0 0 390 844"><title>S090c legal-data-we-collect</title><defs><clipPath id="__frame"><rect width="390" height="844"/></clipPath><clipPath id="c1"><rect x="0" y="0" width="390" height="844" /></clipPath><clipPath id="c2"><rect x="0" y="0" width="390" height="844" /></clipPath></defs><rect width="390" height="844" fill="#ffffff"/><g clip-path="url(#__frame)"><g clip-path="url(#c2)"><rect x="0" y="0" width="390" height="844" fill="#f2f2f2"/><rect x="0" y="0" width="390" height="844" fill="#15120e"/><rect x="0" y="0" width="390" height="844" fill="#15120e"/><g clip-path="url(#c1)"><path d="M38 12H38A18 18 0 0 1 56 30V30A18 18 0 0 1 38 48H38A18 18 0 0 1 20 30V30A18 18 0 0 1 38 12Z" fill="#211c16"/><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5F1EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="29" y="21"><path fill="none" stroke="#F5F1EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m12 19-7-7 7-7"/><path fill="none" stroke="#F5F1EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M19 12H5"/></svg><text x="68" y="36.5" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="#f5f1ea" xml:space="preserve">Data we collect and why</text><path d="M34 68H356A14 14 0 0 1 370 82V101A14 14 0 0 1 356 115H34A14 14 0 0 1 20 101V82A14 14 0 0 1 34 68Z" fill="#2b241b"/><text x="34" y="96" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#e3b94a" xml:space="preserve">⚠️ Placeholder content — not real legal copy</text><text x="20" y="147" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#f5f1ea" xml:space="preserve">This is placeholder text standing in for a real</text><text x="20" y="169" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#f5f1ea" xml:space="preserve">breakdown of data collection. Today the app</text><text x="20" y="191" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#f5f1ea" xml:space="preserve">stores everything locally on-device (origin city,</text><text x="20" y="213" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#f5f1ea" xml:space="preserve">recently viewed destinations, safety/travel</text><text x="20" y="235" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#f5f1ea" xml:space="preserve">preferences, emergency contacts) — nothing is</text><text x="20" y="257" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#f5f1ea" xml:space="preserve">sent to a server, because there is no backend yet.</text><text x="20" y="279" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#f5f1ea" xml:space="preserve">Location is only read when you explicitly grant</text><text x="20" y="301" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#f5f1ea" xml:space="preserve">permission, to show distances and travel times.</text><text x="20" y="323" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#f5f1ea" xml:space="preserve">Replace this entire screen's content with real</text><text x="20" y="345" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#f5f1ea" xml:space="preserve">specifics once a backend and its actual data</text><text x="20" y="367" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#f5f1ea" xml:space="preserve">flows exist.</text></g></g></g></svg>